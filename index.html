<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirScan-QR 📡 无网跨端文件传输方案导航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl text-center space-y-6">
        <div class="inline-flex p-4 bg-blue-600/20 text-blue-400 rounded-2xl text-3xl font-black mb-2">
            📡 AirScan-QR
        </div>
        <h1 class="text-xl font-bold text-slate-100">无网跨端视觉二维码传输</h1>
        
        <div class="p-3 bg-slate-900/60 rounded-2xl border border-slate-700/60 text-xs text-slate-300 flex items-center justify-center gap-2">
            <span>⏱ 页面将在</span>
            <span id="countdown" class="font-mono font-black text-emerald-400 text-lg px-1.5 py-0.5 bg-emerald-500/10 rounded-lg border border-emerald-500/20">10</span>
            <span>秒后自动跳转至高速专业版</span>
            <button id="btnCancel" onclick="cancelTimer()" class="ml-2 text-[10px] text-slate-500 hover:text-slate-300 underline">取消跳转</button>
        </div>

        <div class="space-y-3 pt-1">
            <a href="cimbar-transfer.html" onclick="cancelTimer()" class="block w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-sm transition-all shadow-lg ring-2 ring-emerald-500/30">
                🚀 Cimbar 4-Color 高速专业版 (cimbar-transfer.html)
            </a>
            <a href="airscan-fountain.html" onclick="cancelTimer()" class="block w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-sm transition-all shadow-lg">
                ⛲ 喷泉码四码同传版 (airscan-fountain.html)
            </a>
            <a href="airscan-basic.html" onclick="cancelTimer()" class="block w-full py-3.5 px-4 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl font-bold text-sm transition-all">
                🟢 标准单码循环播放版 (airscan-basic.html)
            </a>
        </div>

        <div class="pt-4 border-t border-slate-700/50 text-[11px] text-slate-500 flex justify-between">
            <a href="airscan-basic-embedded.html" onclick="cancelTimer()" class="hover:text-blue-400 underline">离线单文件版</a>
            <a href="https://github.com/zxq1002/AirScan-QR" target="_blank" class="hover:text-blue-400 underline">GitHub 源码仓库</a>
        </div>
    </div>

    <script>
        let timeLeft = 10;
        const countdownEl = document.getElementById('countdown');
        let timer = setInterval(() => {
            timeLeft--;
            if (countdownEl) {
                countdownEl.textContent = timeLeft;
            }
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = 'cimbar-transfer.html';
            }
        }, 1000);

        function cancelTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
                const parent = countdownEl ? countdownEl.parentElement : null;
                if (parent) {
                    parent.innerHTML = '<span class="text-slate-400">已取消自动跳转，请选择上方版本进入</span>';
                }
            }
        }
    </script>
</body>
</html>
