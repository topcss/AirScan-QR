<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AirScan-QR</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #1b2330;
      --ink2: #5b6478;
      --mut: #9aa4b8;
      --line: #e6eaf2;
      --blue: #3b82f6;
      --blue2: #2563eb;
      --purple: #7c5cfc;
      --green: #16a34a;
      --red: #ef4444;
      --amber: #f59e0b;
      --radius: 18px;
      --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body { margin: 0; height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 内容限宽并居中：宽屏下不会拉成一条 */
    header, main, footer {
      width: 100%;
      max-width: 780px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ---------------- 顶部 ---------------- */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 22px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    header h1 em { font-style: normal; color: var(--blue); }

    .grow { flex: 1; }

    .seg {
      display: flex;
      background: #e9edf5;
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }

    .seg button {
      border: 0;
      background: transparent;
      color: var(--ink2);
      font: 600 16px/1 system-ui, "Microsoft YaHei", sans-serif;
      padding: 10px 24px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .18s, color .18s, box-shadow .18s;
    }

    .seg button.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(23, 38, 70, .12);
    }

    .seg.lang { background: transparent; padding: 0; gap: 6px; border: 1px solid var(--line); border-radius: 999px; }
    .seg.lang button { padding: 7px 14px; font-size: 13px; }
    .seg.lang button.active { box-shadow: none; background: #e8edf7; }

    /* ---------------- 主体 ---------------- */
    main {
      flex: 1;
      display: flex;
      padding: 0 22px 14px;
      gap: 18px;
      min-height: 0;
    }

    .pane {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .pane.active { display: flex; }

    /* 内容超高时滚动，滚动条细一点 */
    .pane::-webkit-scrollbar { width: 8px; }
    .pane::-webkit-scrollbar-thumb { background: #d7ddec; border-radius: 4px; }
    .pane::-webkit-scrollbar-track { background: transparent; }

    /* 大卡片 */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(23, 38, 70, .07);
    }

    /* ---------------- 发送端 ---------------- */
    #dropzone {
      position: relative;
      flex: 1;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: text;
      border: 2px solid var(--line);
      background: #fff;
      overflow: hidden;
    }

    #dropzone:not(.idle) { border-color: transparent; background: #10162a; }

    /* 广播中隐藏文本框，显示条码 */
    #dropzone:not(.idle) .textpanel { display: none; }

    #dropzone.dragover { border-color: var(--blue); border-style: dashed; background: #eff5ff; }



    #dropzone:fullscreen {
      border: 0;
      border-radius: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #dropzone:fullscreen .hint { display: none; }

    #sendCanvas {
      display: block;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: #fff;
      border-radius: 4px;
      pointer-events: none;
    }

    #dropzone.idle #sendCanvas { display: none; }

    .hint {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }

    #dropzone:not(.idle) .hint,
    #camWrap:not(.idle) .hint { display: none; }

    .hint .big {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--ink);
    }

    .hint small { font-size: 16px; color: var(--mut); }

    /* 文本输入面板 */
    .textpanel {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      background: #fff;
      cursor: text;
    }

    .textpanel[hidden] { display: none; }

    .textpanel textarea {
      flex: 1;
      min-height: 110px;
      resize: none;
      font: 18px/1.65 system-ui, "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #fff;
      border: 0;
      padding: 22px 24px 8px;
      outline: none;
    }

    .textpanel textarea::placeholder { color: #b3bcce; }

    .textpanel .tp-info {
      padding: 0 24px 14px;
      font-size: 15px;
      color: var(--mut);
    }

    /* 控制行 */
    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 12px 16px;
    }

    .row label {
      font-size: 16px;
      color: var(--ink2);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row label b {
      font: 700 18px/1 var(--mono);
      color: var(--ink);
      min-width: 2.4em;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      min-width: 140px;
      height: 10px;
      border-radius: 999px;
      background: #e9edf5;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--blue);
      border: 4px solid #fff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, .45);
      cursor: pointer;
    }

    select {
      height: 44px;
      font: 600 16px/1 system-ui, "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #f2f5fa;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0 12px;
    }

    /* 按钮 */
    .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

    /* 次级行：高度统一 44px，字都 16px，垂直居中 */
    .actions.secondary { gap: 10px; }

    .zoomchip {
      height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0 14px;
      border-radius: 12px;
      background: #eef2f9;
      color: var(--ink2);
      font: 600 16px/1 var(--mono);
    }

    .modepick {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      margin-left: auto;
      font-size: 16px;
      color: var(--ink2);
    }

    .btn {
      flex: 1 1 0;
      min-width: 120px;
      height: 52px;
      border: 0;
      border-radius: 14px;
      padding: 0 18px;
      font: 700 17px/1 system-ui, "Microsoft YaHei", sans-serif;
      cursor: pointer;
      transition: transform .1s, box-shadow .18s, background .18s, opacity .18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active:not(:disabled) { transform: scale(.985); }
    .btn:disabled { opacity: .45; cursor: default; }

    .btn.primary { background: var(--blue); background-image: linear-gradient(180deg, #4f8ef9, var(--blue2)); color: #fff; box-shadow: 0 8px 20px rgba(37, 99, 235, .28); }
    .btn.purple { background: var(--purple); background-image: linear-gradient(180deg, #8b6dff, #6b46f5); color: #fff; box-shadow: 0 8px 20px rgba(124, 92, 252, .28); }
    .btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 3px 12px rgba(23, 38, 70, .09); }
    .btn.ghost:hover:not(:disabled) { background: #fbfcff; }
    .btn.bar {
      flex: 0 0 auto;
      min-width: 0;
      height: 44px;
      padding: 0 20px;
      font-size: 16px;
      border-radius: 12px;
    }

    /* ---------------- 接收端 ---------------- */
    #camStage {
      flex: 1;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10162a;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(23, 38, 70, .12);
      position: relative;
    }

    #camWrap {
      position: relative;
      flex: 0 0 auto;
      width: 320px;
      height: 320px;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #cam {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: .01;
      pointer-events: none;
    }

    #camView {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #camView:active { cursor: grabbing; }

    #camWrap.idle #camView { display: none; }

    #camWrap .hint .big { color: #6b7699; font-size: 22px; font-weight: 600; }
    #camWrap .hint small { color: #4d577a; font-size: 15px; }

    /* 扫描线 */
    .scan {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 4%;
      height: 3px;
      opacity: 0;
      pointer-events: none;
      border-radius: 3px;
      background: linear-gradient(90deg, transparent, rgba(90, 200, 255, .25) 12%, #9fe6ff 50%, rgba(90, 200, 255, .25) 88%, transparent);
      box-shadow: 0 0 18px 4px rgba(70, 190, 255, .45);
    }

    #camWrap:not(.idle) .scan {
      opacity: 1;
      animation: scanY 2.8s ease-in-out infinite alternate;
    }

    @keyframes scanY { from { top: 4%; } to { top: 94%; } }

    /* 进度统计 */
    .statcard { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }

    .stathead {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink2);
    }

    .chip {
      margin-left: auto;
      font: 700 15px/1 var(--mono);
      color: var(--blue2);
      background: #e8f0ff;
      border-radius: 999px;
      padding: 8px 14px;
    }

    .statline {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 18px;
      font-size: 16px;
      line-height: 1.4;
      color: var(--ink2);
    }

    .statline b { color: var(--ink); font-family: var(--mono); font-size: 17px; }

    .status {
      font-size: 16px;
      color: var(--ink2);
      min-height: 24px;
      word-break: break-all;
    }

    .status b { color: var(--ink); }
    .status .ok { color: var(--green); }
    .status .warn { color: var(--amber); }
    .status .err { color: var(--red); }

    .bars { display: flex; flex-direction: column; gap: 6px; }

    .bar {
      height: 8px;
      background: #eaeef6;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar > div {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #60a5fa, #22c55e);
      transition: width .25s linear;
    }

    .tip { font-size: 14px; color: var(--mut); }

    /* 结果出来后，底部提示让位给结果卡 */
    .result:not([hidden]) ~ .tip { display: none; }

    /* ---------------- 结果卡 ---------------- */
    .result {
      display: grid;
      grid-template-columns: repeat(4, minmax(88px, 1fr)) auto;
      align-items: stretch;
      gap: 1px;
      background: #dff3e6;
      border: 1px solid #cfead9;
      border-radius: 14px;
      overflow: hidden;
    }

    .result[hidden] { display: none; }

    .result > div {
      background: #f2fbf5;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .result label { font-size: 13px; color: #6b8b78; }
    .result b { font: 700 16px/1.35 var(--mono); color: #14532d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .result .preview .ptxt::-webkit-scrollbar { width: 8px; }
    .result .preview .ptxt::-webkit-scrollbar-thumb { background: #cfe6d9; border-radius: 4px; }
    .result .preview .ptxt::-webkit-scrollbar-track { background: transparent; }

    .result > button {
      border: 0;
      border-radius: 0;
      padding: 12px 20px;
      font: 700 16px/1 system-ui, "Microsoft YaHei", sans-serif;
      color: #fff;
      background: var(--green);
      cursor: pointer;
    }

    .result .preview {
      grid-column: 1 / -1;
      background: #f2fbf5;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result .preview[hidden] { display: none; }

    .result .preview .prow { display: flex; align-items: center; gap: 10px; }
    .result .preview .prow label { font-size: 13px; color: #6b8b78; }

    .result .preview button {
      border: 0;
      border-radius: 8px;
      padding: 8px 16px;
      font: 600 14px/1 system-ui, "Microsoft YaHei", sans-serif;
      color: #14532d;
      background: #d7f0e0;
      cursor: pointer;
    }

    .result .preview .ptxt {
      max-height: 52px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font: 15px/1.55 var(--mono);
      color: #14532d;
      background: #fff;
      border-radius: 8px;
      padding: 10px 12px;
    }

    /* ---------------- 底部 ---------------- */
    footer {
      padding: 4px 22px 12px;
      font: 12px/1 var(--mono);
      color: var(--mut);
      text-align: right;
    }

    /* ---------------- 窄屏 ---------------- */
    @media (max-width: 760px) {
      header { padding: 12px 14px; gap: 10px; }
      header h1 { font-size: 20px; }
      .seg button { padding: 9px 16px; font-size: 15px; }
      main { padding: 0 14px 10px; gap: 12px; }
      .hint .big { font-size: 22px; }
      .hint small { font-size: 14px; }
      .btn { padding: 15px 14px; font-size: 16px; }
      .result { grid-template-columns: 1fr 1fr; }
      .result > button { grid-column: 1 / -1; padding: 14px; }
      .statcard { padding: 12px 14px; }
    }

    @media (max-height: 680px) {
      .tip { display: none; }
      .hint small { display: none; }
    }
  </style>
</head>

<body>

  <header>
    <h1>AirScan<em>-QR</em></h1>
    <span class="grow"></span>
    <div class="seg">
      <button class="tab active" data-pane="send" id="tabSend" data-i18n="tabSend">发送</button>
      <button class="tab" data-pane="recv" id="tabRecv" data-i18n="tabRecv">接收</button>
    </div>
    <div class="seg lang">
      <button data-lang="zh" class="active">中文</button>
      <button data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <!-- ================= 发送 ================= -->
    <section class="pane active" id="pane-send">
      <div class="card idle" id="dropzone">
        <canvas id="sendCanvas"></canvas>

        <!-- 默认就是这块：直接输入文本 -->
        <div class="textpanel" id="textPanel">
          <textarea id="txtInput" data-i18n-ph="txtPlaceholder" placeholder="在这里输入要传的文本…"></textarea>
          <div class="tp-info"><span id="txtInfo">0</span></div>
        </div>
      </div>

      <div class="card row">
        <label><span data-i18n="labelFps">帧率</span> <b id="fpsVal">15</b> FPS</label>
        <input type="range" id="rngFps" min="5" max="20" step="5" value="15">
        <label><span data-i18n="labelMode">模式</span>
          <select id="selMode">
            <option value="68" selected>B</option>
            <option value="66">Bu</option>
            <option value="67">Bm</option>
            <option value="4">4C</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button class="btn ghost" id="btnPick" data-i18n="btnPick">选文件</button>
        <button class="btn primary" id="btnSendText" data-i18n="btnSendText">开始发送</button>
        <button class="btn ghost" id="btnPause" data-i18n="btnPause" hidden>暂停</button>
        <button class="btn ghost" id="btnFull" data-i18n="btnFull" hidden>全屏</button>
        <button class="btn ghost" id="btnBack" data-i18n="btnBack" hidden>重新输入</button>
      </div>

      <div class="card statcard">
        <div class="stathead">
          <span data-i18n="sendStatTitle">发送状态</span>
          <span class="chip" id="hudSendFrames">0 / ?</span>
        </div>
        <div class="status" id="sendStatus">待机</div>
      </div>

      <input type="file" id="fileInput" style="display:none">
    </section>

    <!-- ================= 接收 ================= -->
    <section class="pane" id="pane-recv">
      <div id="camStage">
        <div id="camWrap" class="idle">
          <video id="cam" playsinline muted autoplay></video>
          <canvas id="camView"></canvas>
          <div class="scan"></div>
          <div class="hint">
            <p class="big" data-i18n="recvHintBig">等待启动扫描…</p>
            <small data-i18n="recvHintSmall">选择下面的摄像头或屏幕录制</small>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="btnCam" data-i18n="btnCam">摄像头</button>
        <button class="btn purple" id="btnDisplay" data-i18n="btnDisplay">屏幕录制</button>
      </div>

      <div class="actions secondary">
        <button class="btn bar ghost" id="btnStop" data-i18n="btnStop" disabled>停止</button>
        <button class="btn bar ghost" id="btnFlip" data-i18n="btnFlip">切换镜头</button>
        <button class="btn bar ghost" id="btnResetView" data-i18n="btnResetView" disabled>重置视图</button>
        <span class="zoomchip" id="zoomLabel">1.0×</span>
        <label class="modepick">
          <span data-i18n="labelMode">模式</span>
          <select id="selRecvMode">
            <option value="0" selected data-i18n="optAuto">自动</option>
            <option value="68">B</option>
            <option value="66">Bu</option>
            <option value="67">Bm</option>
            <option value="4">4C</option>
          </select>
        </label>
      </div>

      <div class="card statcard">
        <div class="stathead">
          <span data-i18n="recvStatTitle">进度统计</span>
          <span class="chip" id="hudPct">0%</span>
        </div>

        <div class="statline">
          <span><span data-i18n="labelRate">速率</span> <b id="hudRate">--</b></span>
          <span><span data-i18n="labelEta">剩余</span> <b id="hudEta">--</b></span>
          <span><span data-i18n="labelMode">模式</span> <b id="hudMode">自动</b></span>
          <span><span data-i18n="labelFrames">帧数</span> <b id="hudFrames">0</b></span>
        </div>

        <div class="bars" id="bars"></div>

        <div class="result" id="result" hidden>
          <div><label data-i18n="rFile">文件</label><b id="rName">--</b></div>
          <div><label data-i18n="rSize">大小</label><b id="rSize">--</b></div>
          <div><label data-i18n="rTime">用时</label><b id="rTime">--</b></div>
          <div><label data-i18n="rRate">平均速率</label><b id="rRate">--</b></div>
          <button id="btnDownload" data-i18n="btnDownload">下载文件</button>

          <div class="preview" id="preview" hidden>
            <div class="prow">
              <label data-i18n="textPreview">文本内容</label>
              <button id="btnCopy" data-i18n="btnCopy">复制</button>
            </div>
            <div class="ptxt" id="previewText"></div>
          </div>
        </div>

        <div class="status" id="recvStatus">待机</div>
        <div class="tip" data-i18n="tip">滚轮缩放 · 拖动移动 · 双击复位</div>
      </div>
    </section>
  </main>

  <footer>
    <span id="buildTag"></span>
  </footer>

  <!-- ============ 应用逻辑（必须在 wasm glue 之前定义全局 Module） ============ -->
  <script>
    "use strict";

    var $ = function (id) { return document.getElementById(id); };
    /* ==========================================================
       多语言：中文 / English
       ========================================================== */
    var I18N = {
      zh: {
        title: 'AirScan-QR · 光链路传输',
        subtitle: '光链路传输',
        tabSend: '发送',
        tabRecv: '接收',
        sendStatTitle: '发送状态',
        recvStatTitle: '进度统计',

        sendHintBig: '拖入文件，或点击选择',
        sendHintSmall: '最大 33 MB · 全程本地',
        labelFrame: '帧',
        labelLoop: '轮次',
        labelMode: '模式',
        labelFps: '帧率',
        btnPick: '选择文件',
        btnSendText: '开始发送',
        btnBack: '重新输入',
        btnCancel: '取消',
        txtPlaceholder: '在这里输入要传的文本…',
        txtCounter: '{0} 个字符',
        textPreview: '文本内容',
        btnCopy: '复制',
        copied: '已复制',

      var expected = 0;
      var received = 0;
      var transferring = false;
      var progressFrac = 0;        // fountain 已解码比例（0..1）
      var rateSamples = [];        // 最近几秒的采样，用来算速率
      var transferStartedAt = 0;
      var RATE_WINDOW = 3000;      // 速率取最近 3 秒的窗口

      var completeCb = null;
      var lastFile = null;        // 最近一次收到的文件（供结果卡下载）
      var statusLock = false;     // 完成后锁住状态行，避免被后续进度刷新盖掉
      var stoppedFlag = false;    // 主动停止后，状态行只显示「已停止」
      var lastError = '';
      var dbg = { bytes: 0, bytesLen: 0, progress: [], starts: 0, chunks: 0, ends: 0, misses: 0, drops: 0, lastText: '' };

      function ensureWorkers() {
        if (sinkWorker) return;
        sinkWorker = makeWorker('sink-worker-src');
        sinkWorker.onmessage = function (ev) { onSinkMessage(ev.data); };
        sinkWorker.onerror = function (e) { recvStatus('<span class="err">' + t('workerError') + ' · sink: ' + e.message + '</span>'); };

        for (var i = 0; i < SCAN_WORKERS; i++) {
          (function (idx) {
            var w = makeWorker('scan-worker-src');
            w.onmessage = function (ev) { onScanMessage(idx, ev.data); };
            w.onerror = function (e) { recvStatus('<span class="err">' + t('workerError') + ' · scan: ' + e.message + '</span>'); };
            scanWorkers.push(w);
          })(i);
        }
      }

      function recvStatus(html) {
        $('recvStatus').innerHTML = html;
      }

      // 解码命中时给取景框一下绿色闪光
      var _hitTimer = 0;
      function flashHit() {
        var wrap = $('camWrap');
        if (!wrap || wrap.classList.contains('hit')) {
          return;
        }
        wrap.classList.add('hit');
        clearTimeout(_hitTimer);
        _hitTimer = setTimeout(function () { wrap.classList.remove('hit'); }, 160);
      }

      function statsText(extra) {
        // HUD 读数
        var hasProgress = (transferring || progressFrac > 0);
        var doneState = (statusLock && lastFile);

        if (doneState) {
          // 完成态：保持 100% 和平均速率，别退回 "--"
          setHud('hudPct', '100%', true);
          setHud('hudRate', lastFile.avg > 0 ? rateText(lastFile.avg) : '--', lastFile.avg > 0);
          setHud('hudEta', '--', false);
        } else {
          setHud('hudPct', hasProgress ? Math.round(progressFrac * 100) + '%' : '0%', hasProgress);
          var r0 = currentRate();
          setHud('hudRate', r0 > 0 ? rateText(r0) : '--', r0 > 0);
          var eta = remainingSeconds();
          setHud('hudEta', eta >= 0 ? etaText(eta) : '--', eta >= 0);
        }
        setHud('hudMode', lockedMode ? MODE_NAME[lockedMode] : t('auto'), !!lockedMode);
        setHud('hudSource', sourceKind === 'display' ? t('srcWindow') : t('srcCam'), running);
        setHud('hudFrames', String(frames), frames > 0);

        // 底部那行只留关键信息
        var parts = [];
        if (hasProgress && expected > 0) {
          parts.push(t('received') + ' <b>' + sizeText(Math.round(progressFrac * expected)) + '</b> / ' + sizeText(expected));
        }
        if (!running && !statusLock && !stoppedFlag) parts.push(t('idle'));
        if (!transferring && progressFrac >= 0.999) parts.push('<span class="warn">' + t('decompressing') + '</span>');
        if (extra) parts.push(extra);
        if (!statusLock) {
          recvStatus(parts.join('　·　') || t('scanning'));
        }
      }

      function setHud(id, text, live) {
        var el = $(id);
        if (!el) return;
        el.textContent = text;
        if (live) {
          el.classList.remove('dim');
        } else {
          el.classList.add('dim');
        }
      }

      function sizeText(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' kB';
        return (n / 1024 / 1024).toFixed(2) + ' MB';
      }

      function feedFrame(pixels, format, width, height) {
        if (!scanWorkers.length) return false;
        if (inflight >= 3) return false;   // 队列积压就丢帧，fountain 码不怕丢

        var mode = lockedMode || SCAN_MODES[(cycleIdx++) % SCAN_MODES.length];
        inflight++;
        frames++;

        var w = scanWorkers[rr++ % scanWorkers.length];
        w.postMessage({
          type: 'frame',
          pixels: pixels,
          format: format,
          width: width,
          height: height,
          mode: mode
        }, [pixels.buffer]);
        return true;
      }

      function onScanMessage(idx, d) {
        if (!d || d.type === 'ready') { workerReady++; return; }
        inflight--;

        if (d.type === 'bytes') {
          dbg.bytes++;
          flashHit();
          dbg.bytesLen += d.buff.length;
          // 第一帧的数据块里就带着文件总大小，先记下来，好算速率和剩余时间
          if (d.size && !expected) {
            expected = d.size;
          }
          if (!lockedMode) {
            // 第一次成功解码：锁定模式，由 sink 按这个模式构建 fountain 状态
            lockedMode = d.mode;
            sinkWorker.postMessage({ type: 'mode', mode: lockedMode });
            statsText('<span class="ok">' + t('modeLocked') + '</span>');
          }
          if (d.mode && d.mode !== lockedMode) return;   // 在途的其它模式帧，丢掉
          sinkWorker.postMessage({ type: 'bytes', mode: d.mode, buff: d.buff }, [d.buff.buffer]);
          return;
        }

        if (d.type === 'miss') { dbg.misses++; dbg.lastText = 'miss ' + d.len; }
        if (d.type === 'drop') { dbg.drops++; }
        if (d.type === 'error') {
          lastError = 'scan: ' + d.msg;
          recvStatus('<span class="err">' + t('decodeError') + ': ' + d.msg + '</span>');
        }
      }

      function onSinkMessage(d) {
        if (!d) return;
        dbg.sinkMsgs = (dbg.sinkMsgs || 0) + 1;
        dbg.sinkTypes = dbg.sinkTypes || {};
        dbg.sinkTypes[d.type] = (dbg.sinkTypes[d.type] || 0) + 1;
        if (d.type === 'configured') { dbg.configured = d.mode; return; }

        if (d.type === 'progress') {
          dbg.progress.push(d.text); if (dbg.progress.length > 6) dbg.progress.shift();
          onProgress(d.text);
          return;
        }

        if (d.type === 'file-start') {
          dbg.starts++;
          statusLock = false;
          transferring = true;
          chunks = [];
          fileName = d.name || 'cimbar-download';
          expected = d.expected || 0;
          received = 0;
          statsText('<span class="ok">' + t('receiving') + '</span>');
          return;
        }

        if (d.type === 'chunk') {
          dbg.chunks++;
          chunks.push(d.buff);
          received += d.buff.length;
          statsText();
          return;
        }

        if (d.type === 'file-end') {
          dbg.ends++;
          transferring = false;
          var blob = new Blob(chunks, { type: 'application/octet-stream' });
          var name = d.name || fileName || 'cimbar-download';

          // 文本这类瞬间传完的，用时按 0.1s 下限计，别显示 0.0 秒 / 速率为空
          var elapsed = Math.max(0.1, transferStartedAt ? (performance.now() - transferStartedAt) / 1000 : 0);
          var avg = expected ? (expected / elapsed) : 0;

          lastFile = { name: name, blob: blob, size: blob.size, elapsed: elapsed, avg: avg, mode: lockedMode, frames: frames };
          showResult(lastFile);
          statusLock = true;
          recvStatus('<span class="ok">✓ ' + t('done') + ' · ' + t('clickToSave') + '</span>');
          if (completeCb) completeCb({ name: name, blob: blob, bytes: blob.size, frames: frames, mode: lockedMode, elapsed: elapsed });
          chunks = [];
          progressFrac = 0;          // 别让每秒刷新把完成提示盖掉（进度条宽度保持不变）
          rateSamples = [];
          setHud('hudPct', '100%', true);
          return;
        }

        if (d.type === 'error') {
          lastError = 'sink: ' + d.msg;
          recvStatus('<span class="err">' + t('sinkError') + ': ' + d.msg + '</span>');
        }
      }

      // 进度条 + 速率 / 剩余时间
      function onProgress(text) {
        var arr = null;
        try { arr = JSON.parse(text); } catch (e) { arr = null; }
        if (!Array.isArray(arr)) return;

        renderBars(arr);

        var p = 0;
        for (var i = 0; i < arr.length; i++) {
          var v = Number(arr[i]) || 0;
          if (v > p) p = v;
        }
        progressFrac = Math.max(0, Math.min(1, p));
        if (progressFrac > 0 && progressFrac < 1) {
          statusLock = false;
        }

        var now = performance.now();
        if (progressFrac > 0 && !transferStartedAt) {
          transferStartedAt = now;
        }
        // 用「压缩后负载字节数」来算速率，和 fountain 的进度百分比是同一口径
        rateSamples.push({ t: now, bytes: progressFrac * (expected || 0) });
        while (rateSamples.length > 2 && now - rateSamples[0].t > RATE_WINDOW) {
          rateSamples.shift();
        }

        statsText();
      }

      function currentRate() {
        if (rateSamples.length < 2) return 0;
        var a = rateSamples[0];
        var b = rateSamples[rateSamples.length - 1];
        var dt = (b.t - a.t) / 1000;
        if (dt <= 0.2) return 0;
        return Math.max(0, (b.bytes - a.bytes) / dt);
      }

      function remainingSeconds() {
        var r = currentRate();
        if (!expected || progressFrac <= 0 || progressFrac >= 1 || r <= 0) return -1;
        return (expected * (1 - progressFrac)) / r;
      }

      function rateText(r) {
        if (!r || r <= 0) return '';
        if (r < 1024) return Math.round(r) + ' B/s';
        if (r < 1024 * 1024) return (r / 1024).toFixed(1) + ' kB/s';
        return (r / 1024 / 1024).toFixed(2) + ' MB/s';
      }

      function etaText(s) {
        if (s < 0) return '';
        if (s < 1) return '< 1 ' + t('sec');
        if (s < 60) return Math.round(s) + ' ' + t('sec');
        var m = Math.floor(s / 60);
        var ss = Math.round(s % 60);
        return m + ' ' + t('minute') + ' ' + (ss < 10 ? '0' : '') + ss + ' ' + t('sec');
      }

      function renderBars(arr) {
        var bars = $('bars');
        while (bars.children.length < arr.length) {
          var bar = document.createElement('div');
          bar.className = 'bar';
          bar.appendChild(document.createElement('div'));
          bars.appendChild(bar);
        }
        while (bars.children.length > arr.length) {
          bars.removeChild(bars.lastChild);
        }
        for (var i = 0; i < arr.length; i++) {
          var pct = Math.max(0, Math.min(1, Number(arr[i]) || 0));
          bars.children[i].firstChild.style.width = (pct * 100).toFixed(1) + '%';
        }
      }

      function download(blob, name) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 2000);
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }

      function setText(id, txt) {
        var el = $(id);
        if (el) el.textContent = txt;
      }

      // 收到 .txt 就在结果卡里把内容显示出来（限 256 KB，避免卡顿）
      function maybeShowText(info) {
        var box = $('preview');
        var out = $('previewText');
        if (!box || !out) return;
        var name = info && info.name ? info.name : '';
        if (!info || !info.blob || !/\.txt$/i.test(name) || info.blob.size > 256 * 1024) {
          box.hidden = true;
          out.textContent = '';
          return;
        }
        info.blob.text().then(function (txt) {
          out.textContent = txt;
          box.hidden = false;
        }).catch(function () {
          box.hidden = true;
        });
      }

      function showResult(info) {
        if (!info) return;
        setText('rName', info.name);
        setText('rSize', sizeText(info.size));
        setText('rTime', info.elapsed > 0 ? info.elapsed.toFixed(1) + ' ' + t('sec') : '--');
        setText('rRate', info.avg > 0 ? rateText(info.avg) : '--');
        var box = $('result');
        if (box) box.hidden = false;
        var btn = $('btnDownload');
        if (btn) btn.disabled = !info.blob;
        maybeShowText(info);
      }

      function hideResult() {
        var box = $('result');
        if (box) box.hidden = true;
        var prev = $('preview');
        if (prev) prev.hidden = true;
      }

      function resetTransfer() {
        stoppedFlag = false;
        lastFile = null;
        statusLock = false;
        hideResult();
        chunks = [];
        fileName = '';
        expected = 0;
        received = 0;
        transferring = false;
        lockedMode = 0;
        cycleIdx = 0;
        frames = 0;
        progressFrac = 0;
        rateSamples = [];
        transferStartedAt = 0;
        $('bars').innerHTML = '';
        if (sinkWorker) sinkWorker.postMessage({ type: 'reset' });
      }

      function pump() {
        if (!running) return;
        if (video.requestVideoFrameCallback) {
          video.requestVideoFrameCallback(pump);
        } else {
          window.requestAnimationFrame(pump);
        }
        grabAndFeed();
      }

      // ---------- 取景框：拖动 / 缩放，只把框内的像素喂给解码器 ----------

      // 当前取景：zoom=1 表示整幅画面，cx/cy 是画面中心点（0..1 归一化）
      // 取景框的宽高比（现在是正方形，=1）。裁剪必须按「取景框」的比例来，
      // 否则 16:9 的画面塞进正方形就一定会留黑边，怎么放大都填不满。
      function containerAspect() {
        var wrap = $('camWrap');
        var w = wrap.clientWidth || 1;
        var h = wrap.clientHeight || 1;
        return w / h;
      }

      // zoom=1 时「铺满取景框」对应的裁剪基准尺寸
      function baseCrop() {
        var vw = video.videoWidth, vh = video.videoHeight;
        if (!vw || !vh) return null;
        var ar = containerAspect();
        var bh = Math.min(vh, vw / ar);
        return { ar: ar, h: bh, w: bh * ar, vw: vw, vh: vh };
      }

      // 缩到最小时刚好能看见整幅画面
      function zoomMin() {
        var b = baseCrop();
        if (!b) return 1;
        return Math.min(1, Math.min(b.h / b.vh, b.w / b.vw));
      }

      function clampZoom(z) {
        var lo = zoomMin();
        return Math.max(lo, Math.min(16, z || 1));
      }

      function cropRect() {
        var b = baseCrop();
        if (!b) return null;
        var vw = b.vw, vh = b.vh;
        var z = clampZoom(view.zoom);
        view.zoom = z;

        var cw = Math.min(vw, Math.max(64, b.w / z));
        var ch = Math.min(vh, Math.max(64, b.h / z));

        // 把中心点夹住，别让取景框跑出画面
        var cx = Math.min(Math.max(view.cx, (cw / 2) / vw), 1 - (cw / 2) / vw);
        var cy = Math.min(Math.max(view.cy, (ch / 2) / vh), 1 - (ch / 2) / vh);
        view.cx = cx;
        view.cy = cy;
        return { sx: cx * vw - cw / 2, sy: cy * vh - ch / 2, sw: cw, sh: ch };
      }

      // 取景区是正方形：边长取可用空间的较小值
      function layoutCam() {
        var stage = $('camStage');
        var wrap = $('camWrap');
        if (!stage) return;
        var avail = Math.min(stage.clientWidth, stage.clientHeight);
        var size = Math.max(160, Math.floor(avail));
        wrap.style.width = size + 'px';
        wrap.style.height = size + 'px';
        lastFitKey = '';
      }

      function fitDisplay() {
        if (!camView.width || !camView.height) return;
        var zone = $('camWrap');
        var aw = Math.max(1, zone.clientWidth);
        var ah = Math.max(1, zone.clientHeight);
        var ar = camView.width / camView.height;
        var w = aw, h = w / ar;
        if (h > ah) { h = ah; w = h * ar; }
        camView.style.width = Math.floor(w) + 'px';
        camView.style.height = Math.floor(h) + 'px';
      }

      // 把取景框里的画面画到预览 canvas 上（预览 = 喂给解码器的东西，所见即所得）
      function drawPreview() {
        var r = cropRect();
        if (!r) return null;
        var scale = Math.min(1, MAX_OUT / Math.max(r.sw, r.sh));
        var ow = Math.max(2, Math.round(r.sw * scale));
        var oh = Math.max(2, Math.round(r.sh * scale));
        if (camView.width !== ow || camView.height !== oh) {
          camView.width = ow;
          camView.height = oh;
          lastFitKey = '';
        }
        vctx.drawImage(video, r.sx, r.sy, r.sw, r.sh, 0, 0, ow, oh);
        var key = ow + 'x' + oh + '@' + $('camWrap').clientWidth + 'x' + $('camWrap').clientHeight;
        if (key !== lastFitKey) {
          lastFitKey = key;
          fitDisplay();
        }
        return { r: r, ow: ow, oh: oh };
      }

      function updateZoomLabel() {
        var z = view.zoom;
        var label = (Math.abs(z - zoomMin()) < 0.02)
          ? t('fullFrame')
          : (Math.round(z * 10) / 10).toFixed(1) + '×';
        $('zoomLabel').textContent = label;
        $('btnResetView').disabled = !running;
      }

      function resetView() {
        view.zoom = 1;
        view.cx = 0.5;
        view.cy = 0.5;
        updateZoomLabel();
        if (running) drawPreview();
      }

      // 以 (clientX, clientY) 为锚点缩放：锚点下的那一点画面保持不动
      function zoomAt(clientX, clientY, factor) {
        var vw = video.videoWidth, vh = video.videoHeight;
        if (!vw || !vh) return;
        var rect = camView.getBoundingClientRect();
        if (!rect.width || !rect.height) return;

        var r0 = cropRect();
        if (!r0) return;
        var relX = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        var relY = Math.min(1, Math.max(0, (clientY - rect.top) / rect.height));
        var srcX = r0.sx + relX * r0.sw;
        var srcY = r0.sy + relY * r0.sh;

        var z1 = clampZoom(view.zoom * factor);
        var b = baseCrop();
        var cw1 = Math.min(vw, Math.max(64, b.w / z1));
        var ch1 = Math.min(vh, Math.max(64, b.h / z1));

        view.zoom = z1;
        view.cx = (srcX - relX * cw1 + cw1 / 2) / vw;
        view.cy = (srcY - relY * ch1 + ch1 / 2) / vh;

        updateZoomLabel();
        drawPreview();
      }

      function grabAndFeed() {
        if (video.readyState < 2 || !video.videoWidth) return;
        if (video.currentTime === lastVideoTime) return;

        // 屏幕/窗口捕获的帧率是刷新率（可能 60fps），限一下速，别把 worker 塞满
        if (sourceKind === 'display') {
          var now = performance.now();
          if (now - lastFeedAt < 1000 / DISPLAY_FPS) return;
          lastFeedAt = now;
        }

        lastVideoTime = video.currentTime;

        var drawn = drawPreview();
        if (!drawn) return;

        // 没缩放、没平移时优先走原生 VideoFrame（保留摄像头原始像素，质量最好）
        var isFullFrame = Math.abs(drawn.r.sw - video.videoWidth) < 1 &&
          Math.abs(drawn.r.sh - video.videoHeight) < 1;

        if (isFullFrame && typeof VideoFrame !== 'undefined') {
          var vf = null;
          try {
            vf = new VideoFrame(video, { timestamp: Math.round(performance.now() * 1000) });
            var width = vf.displayWidth;
            var height = vf.displayHeight;
            var params = {};
            if (vf.format !== 'NV12' && vf.format !== 'I420') {
              params.format = 'RGBA';
            }
            var size = vf.allocationSize(params);
            var buff = new Uint8Array(size);
            vf.copyTo(buff, params);
            var fmt = params.format || vf.format;
            if (fmt === 'RGBA' && size !== width * height * 4) {
              fmt = vf.format;   // 兜底
            }
            feedFrame(buff, fmt, width, height);
            return;
          } catch (e) {
            console.log(e);
          } finally {
            if (vf) vf.close();
          }
        }

        // 裁剪/缩放走 canvas（预览 canvas 里就是要解码的画面）
        var img = vctx.getImageData(0, 0, drawn.ow, drawn.oh);
        var copy = new Uint8Array(img.data.buffer, img.data.byteOffset, img.data.byteLength);
        feedFrame(copy, 'RGBA', drawn.ow, drawn.oh);
      }

      function updateControls() {
        $('btnCam').disabled = running;
        $('btnDisplay').disabled = running;
        $('btnStop').disabled = !running;
        $('btnFlip').disabled = running && sourceKind !== 'camera';
        $('btnResetView').disabled = !running;
      }

      // 摄像头和窗口捕获共用一条取流链路
      function attachStream(s, kind) {
        var track = (s.getVideoTracks ? s.getVideoTracks()[0] : null);
        if (track) {
          // 用户在浏览器工具条上点「停止共享」
          track.addEventListener('ended', function () {
            if (running) {
              api.stopCamera();
            }
          });
        }

        stream = s;
        sourceKind = kind;
        video.srcObject = s;

        return video.play().then(function () {
          $('camWrap').classList.remove('idle');
          running = true;
          stoppedFlag = false;
          lastVideoTime = -1;
          lastFeedAt = 0;
          layoutCam();
          resetView();
          updateControls();
          statsText();
          pump();
          return true;
        });
      }

      // ---------- 取景框的鼠标 / 触摸操作 ----------
      (function bindGestures() {
        var wrap = $('camWrap');
        var pointers = {};
        var pinch = null;

        function dist() {
          var ids = Object.keys(pointers);
          if (ids.length < 2) return 0;
          var a = pointers[ids[0]], b = pointers[ids[1]];
          return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function center() {
          var ids = Object.keys(pointers);
          if (ids.length < 2) return null;
          var a = pointers[ids[0]], b = pointers[ids[1]];
          return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        }

        wrap.addEventListener('pointerdown', function (e) {
          if (!running) return;
          pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
          try { wrap.setPointerCapture(e.pointerId); } catch (err) { }
          if (Object.keys(pointers).length === 2) {
            pinch = { d: dist(), zoom: view.zoom };
          }
        });

        wrap.addEventListener('pointermove', function (e) {
          var p = pointers[e.pointerId];
          if (!p) return;
          var dx = e.clientX - p.x;
          var dy = e.clientY - p.y;
          p.x = e.clientX;
          p.y = e.clientY;

          var ids = Object.keys(pointers);
          if (ids.length >= 2 && pinch) {
            var d = dist();
            if (pinch.d > 0 && d > 0) {
              var mid = { x: (pointers[ids[0]].x + pointers[ids[1]].x) / 2, y: (pointers[ids[0]].y + pointers[ids[1]].y) / 2 };
              zoomAt(mid.x, mid.y, (pinch.zoom * (d / pinch.d)) / view.zoom);
            }
            return;
          }

          var r = cropRect();
          var rect = camView.getBoundingClientRect();
          if (!r || !rect.width || !rect.height) return;
          // 只有取景框比画面小（任一方向）时才有得拖
          if (!(r.sw < video.videoWidth - 1 || r.sh < video.videoHeight - 1)) return;
          view.cx -= dx * (r.sw / rect.width) / video.videoWidth;
          view.cy -= dy * (r.sh / rect.height) / video.videoHeight;
          drawPreview();
        });

        function release(e) {
          delete pointers[e.pointerId];
          if (Object.keys(pointers).length < 2) pinch = null;
        }

        wrap.addEventListener('pointerup', release);
        wrap.addEventListener('pointercancel', release);
        wrap.addEventListener('pointerleave', release);

        wrap.addEventListener('wheel', function (e) {
          if (!running) return;
          e.preventDefault();
          zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015));
        }, { passive: false });

        wrap.addEventListener('dblclick', function () {
          if (running) resetView();
        });
      })();

      // 窗口/布局变化时保持正方形（切标签、缩放窗口、全屏都会触发）
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(function () {
          layoutCam();
          fitDisplay();
        }).observe($('camStage'));
      }

      // 每秒刷一次，让速率/剩余时间在丢帧时也能掉下来
      setInterval(function () {
        if (running && (transferring || progressFrac > 0)) {
          statsText();
        }
      }, 1000);

      var api = {
        feedFrame: feedFrame,
        isRunning: function () { return running; },
        sourceKind: function () { return sourceKind; },

        startCamera: function () {
          ensureWorkers();
          resetTransfer();

          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            recvStatus('<span class="err">' + t('camUnsupported') + ' (https / localhost)</span>');
            return Promise.resolve(false);
          }

          var constraints = {
            audio: false,
            video: {
              facingMode: facing,
              width: { min: 720, ideal: 1920 },
              height: { min: 720, ideal: 1080 },
              frameRate: { ideal: 15 }
            }
          };

          return navigator.mediaDevices.getUserMedia(constraints)
            .then(function (s) { return attachStream(s, 'camera'); })
            .catch(function (err) {
              recvStatus('<span class="err">' + t('camFailed') + ': ' + err + '</span>');
              return false;
            });
        },

        // 捕获本机的**别的窗口 / 整个屏幕**：远程桌面、VPN、同机两个浏览器窗口互传都用这个
        startDisplay: function () {
          ensureWorkers();
          resetTransfer();

          if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
            recvStatus('<span class="err">' + t('dispUnsupported') + ' (https / localhost)</span>');
            return Promise.resolve(false);
          }

          // 提示用户选「发送端的那个窗口」——窗口模式比整屏模式的码更大、更容易识别
          recvStatus('<span class="warn">' + t('dispPick') + '</span>');

          var constraints = {
            audio: false,
            video: {
              frameRate: { ideal: DISPLAY_FPS, max: 30 },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          };

          return navigator.mediaDevices.getDisplayMedia(constraints)
            .then(function (s) { return attachStream(s, 'display'); })
            .catch(function (err) {
              recvStatus('<span class="err">' + t('dispFailed') + ': ' + err + '</span>');
              return false;
            });
        },

        stopCamera: function () {
          running = false;
          if (stream) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            stream = null;
          }
          video.srcObject = null;
          $('camWrap').classList.add('idle');
          updateControls();
          statsText('<span class="warn">' + t('stopped') + '</span>');
        },

        // 取景框（也可以从控制台/测试脚本直接调）
        resetView: resetView,
        getView: function () { return { zoom: view.zoom, cx: view.cx, cy: view.cy }; },
        setView: function (v) {
          if (!v) return;
          view.zoom = clampZoom(v.zoom || view.zoom);
          if (v.cx !== undefined) view.cx = v.cx;
          if (v.cy !== undefined) view.cy = v.cy;
          updateZoomLabel();
          if (running) drawPreview();
        },
        // 测试用：把当前取景框内容画出来并返回像素（不喂给解码器）
        peekCrop: function () {
          var d = drawPreview();
          if (!d) return null;
          return { width: d.ow, height: d.oh, crop: d.r };
        },

        layout: function () { layoutCam(); fitDisplay(); },

        flipCamera: function () {
          if (sourceKind !== 'camera') {
            return Promise.resolve(false);
          }
          facing = (facing === 'environment') ? 'user' : 'environment';
          if (running) {
            api.stopCamera();
            return api.startCamera();
          }
          return Promise.resolve(false);
        },

        setOnComplete: function (cb) { completeCb = cb; },

        lastError: function () { return lastError; },

        clearError: function () { lastError = ''; },

        refreshStatus: function (extra) {
          if (lastFile) showResult(lastFile);
          if (statusLock) {
            recvStatus('<span class="ok">✓ ' + t('done') + ' · ' + t('clickToSave') + '</span>');
          }
          statsText(extra);
        },

        lastFile: function () { return lastFile; },

        downloadLast: function () {
          if (lastFile && lastFile.blob) download(lastFile.blob, lastFile.name);
        },

        debug: function () { return dbg; },

        // 自检用：拿一张图（RGBA）直接喂进解码链路
        decodeImage: function (pixels, width, height) {
          ensureWorkers();
          return feedFrame(pixels, 'RGBA', width, height);
        },

        lockMode: function (m) {
          if (!m) return;
          lockedMode = m;
          ensureWorkers();
          sinkWorker.postMessage({ type: 'mode', mode: m });
        },

        resetTransfer: resetTransfer
      };

      return api;
    })();

    /* ==========================================================
       UI 绑定

      function setSending(on) {

        $('btnPause').classList.toggle('primary', sending);
        $('btnPause').classList.toggle('ghost', !sending);
        $('btnPick').hidden = sending;
        $('btnSendText').hidden = sending;
        $('btnPause').hidden = !sending;
        $('btnPause').disabled = !sending;
        $('btnFull').hidden = !sending;
        $('btnBack').hidden = !sending;
        if (!sending) {
          txt.focus();

      }

      function startFile(f) {

      txt.addEventListener('input', updateTxtInfo);

      $('btnSendText').onclick = function () {

        });
      };

      // 回到文本输入（停止广播）
      $('btnBack').onclick = function () {

      // 编码器开始/停止广播时，按钮跟着切

      /* ---------- 结果卡：复制文本 ---------- */
      $('btnCopy').onclick = function () {

        var text = el ? el.textContent : '';

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(done);

      $('selMode').onchange = function () {

      };

      $('rngFps').oninput = function () {
        Sender.setFPS(this.value);
      };

      $('btnPause').onclick = function () {
        Sender.setPaused(!Sender.isPaused());
      };

      $('btnFull').onclick = function () { Sender.toggleFullscreen(); };

      document.addEventListener('fullscreenchange', function () {
        $('btnFull').textContent = document.fullscreenElement ? t('btnExitFull') : t('btnFull');
        Sender.layout();
      });

      $('btnCam').onclick = function () { Receiver.startCamera(); };
      $('btnDisplay').onclick = function () { Receiver.startDisplay(); };
      $('btnStop').onclick = function () { Receiver.stopCamera(); };
      $('btnFlip').onclick = function () { Receiver.flipCamera(); };
      $('btnResetView').onclick = function () { Receiver.resetView(); };

      $('btnDownload').onclick = function () {

      $('selRecvMode').onchange = function () {

      window.addEventListener('resize', function () {

        Receiver.layout();

      if ($('buildTag')) {
        $('buildTag').textContent = 'build ' + BUILD_TAG;

      // 初始：文本框可用，暂停/全屏/重新输入都收起
      setSending(false);
      updateTxtInfo();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { Sender.layout(); });
      }
    })();

    // 供自动化 / 调试使用
    window.CimbarApp = {
      sender: Sender,
      receiver: Receiver,

    // 语言切换按钮 + 记住上次选择

        saved = localStorage.getItem('airscan.lang') || 'zh';

      setLang(saved);
    })();

  <!-- ============ worker 源码（内联，运行时用 Blob URL 启动） ============ -->
  <script type="text/plain" id="scan-worker-src">
// cimbar 扫描 worker：一帧图像 -> cimbar 解出若干 fountain 数据块
// 每个 worker 持有独立的 wasm 实例

var Module = {
  // Blob worker 里 self.location 是 blob:…，相对路径会失效，所以 wasm 走绝对路径
  locateFile: function (p) { return __CIMBAR_BASE__ + p; },
  onRuntimeInitialized: function () {
    _ready = true;
    self.postMessage({ type: 'ready' });
  }
};

var _ready = false;

function u8(ptr, len) {
  return new Uint8Array(Module.HEAPU8.buffer, ptr, len);
}

// 每个 fountain 块的前 6 字节是 FountainMetadata：
//   [0] = (encode_id & 0x7F) | ((size >> 17) & 0x80)
//   [1..3] = size 的 16/8/0 位，[4..5] = block_id
// 所以不用等收完，第一帧就能知道这份文件的（压缩后）总大小，用来算速率/剩余时间。
function readMetaSize(buff) {
  if (!buff || buff.length < 6) {
    return 0;
  }
  return (buff[3] | (buff[2] << 8) | (buff[1] << 16) | ((buff[0] & 0x80) << 17)) >>> 0;
}

self.onmessage = function (event) {
  const d = event.data;
  if (!d || d.type !== 'frame') {
    return;
  }
  if (!_ready) {
    self.postMessage({ type: 'drop' });
    return;
  }

  const pixels = d.pixels;
  const format = d.format;
  const width = d.width;
  const height = d.height;
  const mode = d.mode;

  let imgPtr = 0;
  let fPtr = 0;
  try {
    // 自动模式下每一帧的模式都可能不同，所以按帧配置
    if (mode) {
      Module._cimbard_configure_decode(mode);
    }

    const type = format === 'NV12' ? 12 : (format === 'I420' ? 420 : 4);

    imgPtr = Module._malloc(pixels.length);
    u8(imgPtr, pixels.length).set(pixels);

    const bufSize = Module._cimbard_get_bufsize();
    fPtr = Module._malloc(bufSize);

    const len = Module._cimbard_scan_extract_decode(imgPtr, width, height, type, fPtr, bufSize);
    if (len > 0) {
      const buff = u8(fPtr, len).slice();
      self.postMessage({ type: 'bytes', mode: mode, buff: buff, size: readMetaSize(buff) }, [buff.buffer]);
    } else {
      // len == 0    : 找到了码但没有新数据
      // len == -3   : 这一帧没提取到码（最常见）
      self.postMessage({ type: 'miss', len: len });
    }
  } catch (err) {
    self.postMessage({ type: 'error', msg: String(err) });
  } finally {
    if (imgPtr) Module._free(imgPtr);
    if (fPtr) Module._free(fPtr);
  }
};

importScripts(__CIMBAR_BASE__ + 'cimbar_js.js');
</script>

  <script type="text/plain" id="sink-worker-src">
// cimbar 接收 worker：fountain 数据块 -> 完整文件
// 与 scan-worker 分开是因为 fountain 解码器的状态不能跟着「自动模式」来回重置

var Module = {
  // Blob worker 里 self.location 是 blob:…，相对路径会失效，所以 wasm 走绝对路径
  locateFile: function (p) { return __CIMBAR_BASE__ + p; },
  onRuntimeInitialized: function () {
    _ready = true;
    self.postMessage({ type: 'ready' });
  }
};

var _ready = false;
var _mode = 0;

var _fPtr = 0, _fLen = 0;       // fountain 输入缓冲
var _errPtr = 0, _errLen = 1024; // 报告 / 文件名缓冲
var _decPtr = 0, _decLen = 0;    // 解压输出缓冲

function u8(ptr, len) {
  return new Uint8Array(Module.HEAPU8.buffer, ptr, len);
}

function allocCommon() {
  if (!_errPtr) {
    _errPtr = Module._malloc(_errLen);
  }
  if (!_decPtr) {
    _decLen = Module._cimbard_get_decompress_bufsize();
    _decPtr = Module._malloc(_decLen);
  }
}

function allocFountain() {
  const need = Module._cimbard_get_bufsize();
  if (_fPtr && need > _fLen) {
    Module._free(_fPtr);
    _fPtr = 0;
  }
  if (!_fPtr) {
    _fLen = need;
    _fPtr = Module._malloc(_fLen);
  }
}

function reportText() {
  const n = Module._cimbard_get_report(_errPtr, _errLen);
  if (n <= 0) {
    return '';
  }
  return new TextDecoder().decode(u8(_errPtr, n));
}

function configure(mode) {
  Module._cimbard_configure_decode(mode);
  _mode = mode;
  allocCommon();
  allocFountain();
}

// fountain 解码完成：取文件名，流式解压，边解边发
// 注意：fountain_decode 返回 BigInt，而 C 接口的 id 参数是 uint32，必须转成 Number
function assemble(bigId) {
  const id = Number(bigId);
  const sizeExpected = Module._cimbard_get_filesize(id);

  let name = 'cimbar-download';
  const fnLen = Module._cimbard_get_filename(id, _errPtr, _errLen);
  if (fnLen > 0) {
    name = new TextDecoder('utf-8').decode(u8(_errPtr, fnLen));
  }

  self.postMessage({ type: 'file-start', name: name, expected: sizeExpected });

  let total = 0;
  for (;;) {
    const n = Module._cimbard_decompress_read(id, _decPtr, _decLen);
    if (n <= 0) {
      break;
    }
    const chunk = u8(_decPtr, n).slice();
    total += chunk.length;
    self.postMessage({ type: 'chunk', buff: chunk }, [chunk.buffer]);
  }

  self.postMessage({ type: 'file-end', name: name, size: total, expected: sizeExpected });
}

self.onmessage = function (event) {
  const d = event.data;
  if (!d) {
    return;
  }

  if (!_ready) {
    self.postMessage({ type: 'drop' });
    return;
  }

  try {
    if (d.type === 'mode') {
      configure(d.mode || 68);
      self.postMessage({ type: 'configured', mode: _mode });
      return;
    }

    if (d.type === 'reset') {
      // 唯一的复位手段：切到别的模式再切回来（C 接口没有单独的 reset）
      const other = _mode === 68 ? 4 : 68;
      Module._cimbard_configure_decode(other);
      Module._cimbard_configure_decode(_mode || 68);
      allocFountain();
      self.postMessage({ type: 'configured', mode: _mode });
      return;
    }

    if (d.type !== 'bytes') {
      return;
    }

    // 模式还没锁定，或者这一块来自别的模式（自动模式切换时的在途帧），丢掉
    if (!_mode) {
      configure(d.mode || 68);
    }
    if (d.mode && d.mode !== _mode) {
      return;
    }

    allocCommon();
    allocFountain();

    const buff = d.buff;
    u8(_fPtr, buff.length).set(buff);

    const res = Module._cimbard_fountain_decode(_fPtr, buff.length); // int64_t -> BigInt
    const resBig = (typeof res === 'bigint') ? res : BigInt(res);
    const id = BigInt.asUintN(32, resBig);

    const text = reportText();
    if (text) {
      self.postMessage({ type: 'progress', text: text });
    }

    if (resBig > 0n) {
      assemble(id);
    }
  } catch (err) {
    self.postMessage({ type: 'error', msg: String(err) });
  }
};

importScripts(__CIMBAR_BASE__ + 'cimbar_js.js');
</script>
